name: clix
description: Powerful Dart CLI toolkit for building interactive command-line applications with argument parsing, commands, prompts, styling, logging, and progress indicators.
version: 2.0.0
homepage: https://github.com/altwaireb/clix
repository: https://github.com/altwaireb/clix
issue_tracker: https://github.com/altwaireb/clix/issues
documentation: https://pub.dev/documentation/clix
funding:
  - https://github.com/sponsors/altwaireb

topics:
  - cli
  - command-line
  - terminal
  - prompts
  - logging

assets:
  - assets/logo.png

screenshots:
  - description: "Clix Logo - CLI Development Toolkit for Dart"
    path: assets/logo.png

environment:
  sdk: ^3.8.2

dependencies:
  ffi: ^2.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
